apiVersion: apps/v1
kind: Deployment
metadata:
  name: cia2-cloud-cicd-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cia2-cloud-cicd-demo
  template:
    metadata:
      labels:
        app: cia2-cloud-cicd-demo
    spec:
      containers:
        - name: app
          image: laksh4950/cia2-cloud-cicd-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cia2-cloud-cicd-demo
spec:
  type: NodePort
  selector:
    app: cia2-cloud-cicd-demo
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
