<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud CI/CD Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 10vh auto; padding: 24px; }
    main { border: 1px solid #ddd; border-radius: 12px; padding: 28px; }
    #message { font-size: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Cloud CI/CD Demo</h1>
    <p id="message">Loading backend message…</p>
    <p>Backend version: <strong id="version">—</strong></p>
  </main>
  <script>
    fetch('/api/status')
      .then(response => {
        if (!response.ok) throw new Error('Backend request failed');
        return response.json();
      })
      .then(data => {
        document.getElementById('message').textContent = data.message;
        document.getElementById('version').textContent = data.version;
      })
      .catch(() => {
        document.getElementById('message').textContent = 'Could not load the backend message.';
      });
  </script>
</body>
</html>
